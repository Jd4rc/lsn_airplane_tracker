[project]
name = "lsn-airplane-tracker"
version = "0.1.0"
description = ""
authors = [
    {name = "dosed",email = "e.nmitenin@gmail.com"}
]
readme = "README.md"
requires-python = "^3.14"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.black]
line-length = 119

[tool.isort]
profile = "black"
line_length = 119
force_single_line = true

[tool.flake8]
max-line-length = 119

[tool.mypy]
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'
explicit_package_bases = true

